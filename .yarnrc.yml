nodeLinker: node-modules
nmHoistingLimits: workspaces

# Third-party lifecycle scripts require an explicit dependenciesMeta allowlist.
enableScripts: false

# Git-hosted dependencies must be explicitly approved before Yarn can fetch them.
approvedGitRepositories: []

# Delay new registry releases for 24 hours, except for first-party packages.
npmMinimalAgeGate: 1d
npmPreapprovedPackages:
  - '@polygonlabs/*'
  - '@maticnetwork/*'
  - '@agglayer/*'
  - '@0xsequence/*'
  - '@0xtrails/*'

yarnPath: .yarn/releases/yarn-4.18.0.cjs
