version: 2
updates:
  # Root package (library + workspaces)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - dependencies

  # Expo example (standalone npm project). The Expo SDK pins React, React Native,
  # and Babel; move them with an Expo SDK upgrade (`npx expo install --fix`).
  - package-ecosystem: npm
    directory: /examples/expo-example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    labels:
      - dependencies
    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@babel/core'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Supported-minimum Expo fixture. Only patch updates for the pinned stack;
  # raising the minimum is a deliberate pull request.
  - package-ecosystem: npm
    directory: /compatibility-tests/expo-min
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    labels:
      - dependencies
    ignore:
      - dependency-name: expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # CI installs the SDK from the packed PR tarball, so this pin is never what gets built.
      - dependency-name: '@polygonlabs/oms-wallet-react-native'
    # Expo, React, and React Native patches move together, as in the Kotlin SDK's mirror fixture.
    groups:
      expo-min-patch:
        patterns:
          - expo
          - react
          - react-native

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - dependencies
      - ci

  # Ruby and CocoaPods tooling for the bare React Native example. The trails-actions example
  # is not built in CI, so its tooling is updated by hand.
  - package-ecosystem: bundler
    directory: /examples/sdk-example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    labels:
      - dependencies

  # Gradle wrapper and example build tooling. Native OMS SDK pins remain coordinated manually.
  # The React Native template sets the Gradle and Kotlin plugin versions; move them with a
  # React Native upgrade.
  - package-ecosystem: gradle
    directory: /examples/sdk-example/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    labels:
      - dependencies
    ignore:
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: org.jetbrains.kotlin:kotlin-gradle-plugin
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
