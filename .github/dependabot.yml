version: 2
updates:
  # Root package (library + workspaces)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Expo example (standalone npm project)
  - package-ecosystem: npm
    directory: /examples/expo-example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  # Supported-minimum Expo fixture. Only patch updates for the pinned stack;
  # raising the minimum is a deliberate pull request.
  - package-ecosystem: npm
    directory: /compatibility-tests/expo-min
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    ignore:
      - dependency-name: expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # CI installs the SDK from the packed PR tarball, so this pin is never what gets built.
      - dependency-name: '@polygonlabs/oms-wallet-react-native'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # Ruby and CocoaPods tooling for the bare React Native examples
  - package-ecosystem: bundler
    directory: /examples/sdk-example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: bundler
    directory: /examples/trails-actions-example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  # Gradle wrappers and example build tooling. Native OMS SDK pins remain coordinated manually.
  - package-ecosystem: gradle
    directory: /examples/sdk-example/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: gradle
    directory: /examples/trails-actions-example/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
