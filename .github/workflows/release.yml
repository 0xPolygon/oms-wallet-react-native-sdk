name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: npm dist-tag for a staged snapshot (for example canary or pre-0.3.0)
        required: true
        default: snapshot

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verification:
    uses: ./.github/workflows/verification.yml

  release:
    name: Release PR or stage package
    if: github.event_name == 'push'
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CHANGESET_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.CHANGESET_RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup without release caches
        uses: ./.github/actions/setup
        with:
          cache-dependencies: 'false'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.15.0
      - name: Create release pull request or stage package
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: 'chore(release): publish package'
          commit: 'chore(release): version package'
          commitMode: github-api
          version: yarn changeset version
          # The helper packs the package and stages it with npm. Its `New tag:` output lets
          # changesets/action create the package tag and GitHub Release.
          publish: yarn ci:stage-release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  snapshot:
    name: Stage snapshot
    if: github.event_name == 'workflow_dispatch'
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate snapshot tag
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: |
          if [[ "$SNAPSHOT_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
            echo "::error title=Invalid snapshot tag::$SNAPSHOT_TAG looks like a real SemVer release."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup without release caches
        uses: ./.github/actions/setup
        with:
          cache-dependencies: 'false'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.15.0
      - name: Version snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: node scripts/prepare-npm-snapshot.mjs
      - name: Stage snapshot package
        env:
          NPM_STAGE_CREATE_GIT_TAGS: 'false'
          NPM_STAGE_TAG: ${{ inputs.snapshot_tag }}
        run: yarn ci:stage-release
