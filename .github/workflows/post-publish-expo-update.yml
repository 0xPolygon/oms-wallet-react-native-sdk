name: Post-publish Expo update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published SDK version to install in the standalone Expo example
        required: true

concurrency:
  group: post-publish-expo-update-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Open Expo example update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CHANGESET_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.CHANGESET_RELEASE_BOT_APP_PRIVATE_KEY }}
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Open published Expo example update
        run: node scripts/open-expo-update-pr.mjs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISHED_VERSION: ${{ inputs.version }}
